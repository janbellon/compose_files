services:
  unifi:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi
    restart: unless-stopped
    env_file:
      - path: default.env
        required: true
    volumes:
      - unifi_data:/config
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
    networks:
      - unifi

  unifi_db:
    image: docker.io/mongo:8.3.7
    container_name: unifi_db
    restart: unless-stopped
    env_file:
      - path: default.env
        required: true
    volumes:
      - unifi_db:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks:
      - unifi

volumes:
  unifi_data:
  unifi_db:

networks:
  unifi:
