local-address=0.0.0.0, ::
local-port=53

launch=gpgsql
gpgsql-host=postgres
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns
gpgsql-password=changeme

api=yes
api-key=changeme
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0,::/0

default-soa-content=ns1.example.com. hostmaster.@ 0 10800 3600 604800 3600
loglevel=4
