include:
  - ../../../base/powerdns/compose.yml

services:
  powerdns_db:
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    env_file:
      - path: override.env
        required: true

  powerdns:
    ports:
      - 53:53
      - 8081:8081
    volumes:
      - ./pdns.conf:/etc/powerdns/pdns.conf:ro

  powerdns_admin:
    env_file:
      - path: override.env
        required: true
    ports:
      - 9191:80
