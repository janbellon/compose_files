include:
  - ../../../base/uptime-kuma/compose.yml

services:
  uptime_kuma:
    labels:
      caddy: status.nobell.fr
      caddy.reverse_proxy: "http://uptime_kuma:3001"
      caddy.tls: /certs/nobell.fr/fullchain.pem /certs/nobell.fr/privkey.pem
    networks:
      - caddy
      - uptime_kuma

networks:
  caddy:
    external: true
  uptime_kuma:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:dead:beef::/64
