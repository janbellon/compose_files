include:
  - ../../../base/knot/compose.yml
  - ../../../base/unbound/compose.yml

services:
  knot:
    command: ["-c", "/config/knot.conf"]
    volumes:
      - ./priv_knot.conf:/config/knot.conf
      - ./priv_zones:/zones
    networks:
      vnet80:
        ipv4_address: 10.0.80.2
        ipv6_address: 2001:470:ca40:80::2

  unbound:
    volumes:
      - ./priv_unbound:/opt/unbound/etc/unbound
    ports:
      - "10.0.1.1:53:53/udp"
      - "10.0.1.1:53:53/tcp"

networks:
  vnet80:
    external: true
