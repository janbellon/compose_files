include:
  - ../../../base/knot/compose.yml
  - ../../../base/unbound/compose.yml

services:
  knot:
    command: ["-c", "/config/knot.conf"]
    volumes:
      - ./priv_knot.conf:/config/knot.conf
      - ./priv_zones:/zones
    networks:
      dns:
        ipv4_address: 192.168.53.10
      vnet80:
        ipv4_address: 10.0.80.3

  unbound:
    volumes:
      - ./priv_unbound:/opt/unbound/etc/unbound
    ports:
      - "10.0.1.1:53:53/udp"
      - "10.0.1.1:53:53/tcp"
    networks:
      dns:
        ipv4_address: 192.168.53.11

networks:
  dns:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.53.0/24
          gateway: 192.168.53.1
  vnet80:
    external: true
